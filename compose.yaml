name: nexo

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo-local-development
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__NexoDb: Host=db;Port=5432;Database=nexo;Username=nexo;Password=nexo-local-development
      # Outgoing mail goes to the fake `mail` service unless `.env` points these at a real SMTP provider.
      Email__Host: ${EMAIL_HOST:-mail}
      Email__Port: ${EMAIL_PORT:-1025}
      Email__EnableSsl: ${EMAIL_ENABLE_SSL:-false}
      Email__Username: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__From: "${EMAIL_FROM:-Nexo <no-reply@nexo.local>}"
      Email__WebBaseUrl: ${EMAIL_WEB_BASE_URL:-http://localhost:5173}
      # Local-development signing key; set JWT_KEY in `.env` for anything else.
      Jwt__Key: ${JWT_KEY:-nexo-local-development-signing-key-change-me}
      # Google sign-in is enabled only when both values are set in `.env`.
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:5122:8080"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started

  # Fake SMTP server: accepts mail on 1025 and shows it in a webmail-style inbox on 8025. Nothing is relayed.
  mail:
    build: ./tools/fake-smtp
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - ${MAIL_DATA_DIR:-./.data/mail}:/data

  web:
    build: ./web
    environment:
      # The dev server proxies /api to the API service (browser requests stay same-origin, so no CORS).
      VITE_API_URL: http://api:8080
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  postgres-data:
