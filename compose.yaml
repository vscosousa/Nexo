name: nexo

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo-local-development
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__NexoDb: Host=db;Port=5432;Database=nexo;Username=nexo;Password=nexo-local-development
    ports:
      - "127.0.0.1:5122:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  postgres-data:
