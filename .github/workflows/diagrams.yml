name: PlantUML diagrams

on:
  push:
    paths:
      - 'docs/**'
      - 'libs/plantuml.json'
      - 'tools/generate/**'
      - '.github/workflows/diagrams.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'libs/plantuml.json'
      - 'tools/generate/**'
      - '.github/workflows/diagrams.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagrams-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz
      - name: Test generator
        shell: pwsh
        run: ./tools/generate/test-plantuml-diagrams.ps1
      - name: Render SVGs
        shell: pwsh
        run: ./tools/generate/generate-plantuml-diagrams.ps1
      - name: Package generated changes
        shell: bash
        run: |
          git add -A -- ':(glob)docs/**/svg/*.svg'
          git diff --cached --binary > diagrams.patch
      - uses: actions/upload-artifact@v7
        with:
          name: diagram-changes
          path: diagrams.patch
      - uses: actions/upload-artifact@v7
        with:
          name: diagram-previews
          path: docs/**/svg/*.svg
          if-no-files-found: ignore

  publish:
    needs: render
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: diagram-changes
      - name: Commit generated SVGs
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if [ ! -s diagrams.patch ]; then
            echo 'No diagram changes.'
            exit 0
          fi
          git apply --index diagrams.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: regenerate PlantUML SVGs'
          git push origin "HEAD:$TARGET_BRANCH"
