<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Nexo Mail</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%231a73e8' d='M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <button class="icon-btn" id="menu" aria-label="Toggle sidebar" title="Menu">
        <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" /></svg>
      </button>
      <a class="logo" href="/" aria-label="Nexo Mail">
        <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z" /></svg>
        <span>Nexo <b>Mail</b></span>
      </a>
      <form class="search" id="search" role="search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" /></svg>
        <input id="q" type="search" placeholder="Search mail" autocomplete="off" aria-label="Search mail" />
      </form>
      <span class="avatar me" title="Local test mailbox">N</span>
    </header>

    <div class="layout" id="layout">
      <nav class="sidebar" aria-label="Mailbox">
        <a class="nav-item active" href="/" id="inbox-link">
          <svg viewBox="0 0 24 24"><path d="M19 3H4.99C3.89 3 3 3.9 3 5l.01 14c0 1.1.89 2 1.99 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 12h-4c0 1.66-1.35 3-3 3s-3-1.34-3-3H4.99V5H19v10z" /></svg>
          <span class="grow">Inbox</span>
          <span class="count" id="unread-count" hidden></span>
        </a>
        <div class="smtp-card">
          <strong>Fake SMTP server</strong>
          <span>Send mail to <code id="smtp-address">localhost:1025</code></span>
          <span class="muted">Nothing here leaves your machine.</span>
        </div>
        <button class="text-btn danger" id="delete-all">Delete all messages</button>
      </nav>

      <main class="panel">
        <section id="list-view">
          <div class="toolbar">
            <button class="icon-btn" id="refresh" aria-label="Refresh" title="Refresh">
              <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" /></svg>
            </button>
            <button class="icon-btn" id="mark-all-read" aria-label="Mark all as read" title="Mark all as read">
              <svg viewBox="0 0 24 24"><path d="M18 7l-1.41-1.41-6.34 6.34 1.41 1.41L18 7zm4.24-1.41L11.66 16.17 7.48 12l-1.41 1.41L11.66 19l12-12-1.42-1.41zM.41 13.41 6 19l1.41-1.41L1.83 12 .41 13.41z" /></svg>
            </button>
            <span class="toolbar-info" id="list-info"></span>
          </div>
          <ul class="rows" id="rows"></ul>
          <div class="empty" id="empty" hidden>
            <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 14H4V8l8 5 8-5v10zm-8-7L4 6h16l-8 5z" /></svg>
            <h2 id="empty-title">Your inbox is empty</h2>
            <p id="empty-text">Emails sent by Nexo (or any SMTP client) show up here.</p>
          </div>
        </section>

        <section id="reader" hidden>
          <div class="toolbar">
            <button class="icon-btn" id="back" aria-label="Back to inbox" title="Back to inbox">
              <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" /></svg>
            </button>
            <button class="icon-btn" id="delete" aria-label="Delete" title="Delete">
              <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" /></svg>
            </button>
            <button class="icon-btn" id="mark-unread" aria-label="Mark as unread" title="Mark as unread">
              <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z" /></svg>
            </button>
            <span class="grow"></span>
            <div class="tabs" role="tablist" id="tabs"></div>
          </div>
          <article class="message">
            <h1 id="subject"></h1>
            <div class="sender">
              <span class="avatar" id="sender-avatar"></span>
              <div class="grow">
                <div><strong id="sender-name"></strong> <span class="muted" id="sender-address"></span></div>
                <div class="muted small" id="recipients"></div>
              </div>
              <time class="muted small" id="sent-at"></time>
            </div>
            <div class="attachments" id="attachments"></div>
            <div class="body" id="body"></div>
          </article>
        </section>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
